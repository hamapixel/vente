name: Verification Windows

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Installer les dependances
        run: npm install
      - name: Controle des vulnérabilités npm (toutes les dépendances)
        run: npm audit --audit-level=moderate
      - name: Controle des dépendances embarquées
        run: npm audit --omit=dev --audit-level=moderate
      - name: Generer les icones Windows
        run: npm run tauri icon public/brand.svg
      - name: Verifier TypeScript et Vite
        run: npm run build
      - name: Tester la recherche des produits et chaussures
        run: npm run test
      - name: Verifier Rust et Tauri
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Tester la sécurité locale et la préservation SQLite
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Construire installateur Windows VestiFlow 0.2.1
        run: npm run tauri build
      - name: Vérifier le fichier NSIS créé
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "VestiFlow_0.2.1_*setup.exe" -ErrorAction Stop)
          if ($setups.Count -ne 1) { throw "Installateur VestiFlow 0.2.1 introuvable" }
          Write-Host "Setup : $($setups[0].FullName)"
          Get-FileHash $setups[0].FullName -Algorithm SHA256
